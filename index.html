<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>영광 커넥트 · 주소가 바뀌었습니다</title>
<style>
:root{--green:#3aa66e;--teal:#2fa58f;--ink:#26313f;--muted:#6b7686;--line:#dde4ee}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Malgun Gothic','맑은 고딕',system-ui,-apple-system,sans-serif;
background:#f5f7fb;color:var(--ink);display:flex;align-items:center;justify-content:center;
padding:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;max-width:400px;width:100%;
overflow:hidden;box-shadow:0 6px 22px rgba(20,40,80,.09)}
.hd{background:linear-gradient(135deg,#57b45f,#2fa58f);color:#fff;padding:22px 22px 20px;text-align:center}
.hd .k{font-size:12px;opacity:.93;font-weight:700;letter-spacing:.5px}
.hd .n{font-size:22px;font-weight:800;margin-top:5px}
.bd{padding:22px}
h1{font-size:18px;margin:0 0 10px;line-height:1.5}
p{font-size:14.5px;color:var(--muted);line-height:1.85;margin:0 0 16px}
b{color:var(--ink)}
.addr{display:block;background:#f4f7fb;border:1px solid var(--line);border-radius:12px;
padding:13px 14px;font-size:14.5px;font-weight:800;color:#2e74b5;text-align:center;
word-break:break-all;margin-bottom:16px;text-decoration:none}
.btn{display:block;width:100%;border:0;border-radius:13px;height:52px;line-height:52px;
font-size:16px;font-weight:800;font-family:inherit;text-align:center;text-decoration:none;
background:linear-gradient(135deg,#57b45f,#2fa58f);color:#fff}
.tip{background:#fffbf2;border:1px solid #f6d9a8;border-radius:12px;padding:13px 14px;
font-size:13px;color:#8a5a12;line-height:1.85;margin-top:16px}
.tip b{color:#6b4409}
.cnt{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
.cnt b{color:var(--green);font-size:15px}
.foot{font-size:11.5px;color:#9aa4b2;text-align:center;margin-top:18px;line-height:1.7}
</style>
</head><body>
<div class="card">
  <div class="hd">
    <div class="k">GLORY CONNECT</div>
    <div class="n">영광 커넥트</div>
  </div>
  <div class="bd">
    <h1 id="ttl">앱 주소가 바뀌었습니다</h1>
    <p id="msg">아래 새 주소로 들어와 주세요.</p>
    <a class="addr" id="lnk" href="https://visionspeaker.github.io/stgc/">visionspeaker.github.io/stgc</a>
    <a class="btn" href="https://visionspeaker.github.io/stgc/">새 주소로 이동</a>
    <div class="cnt" id="cnt"></div>
    <div class="tip" id="tip">
      <b>홈 화면에 앱을 추가해 두셨다면</b><br>
      예전 아이콘은 지우시고, 새 주소에서 다시 추가해 주세요.<br>
      로그인 상태와 기록은 그대로 유지됩니다.
    </div>
    <div class="foot">
      송탄영광교회 · 영광 커넥트<br>
      © 2026 songtanglorychurch. All rights reserved.
    </div>
  </div>
</div>
<script>
(function(){
  var NEW = 'https://visionspeaker.github.io/stgc/';
  /* 2026-08-23 00:00 (한국시간) 부터는 자동 이동을 멈추고 안내만 보여 준다 */
  var STOP = new Date('2026-08-23T00:00:00+09:00').getTime();
  var now  = Date.now();

  if (now < STOP){
    /* 아직 이전 기간 — 잠깐 안내를 보여 준 뒤 새 주소로 옮겨 준다 */
    document.getElementById('ttl').textContent = '새 주소로 이동합니다';
    document.getElementById('msg').innerHTML =
      '앱 주소가 <b>visionspeaker.github.io/stgc</b> 로 바뀌었습니다.<br>잠시 후 자동으로 이동합니다.';
    var left = 3;
    var cnt = document.getElementById('cnt');
    cnt.innerHTML = '<b>' + left + '</b>초 후 이동합니다';
    var t = setInterval(function(){
      left--;
      if (left <= 0){ clearInterval(t); location.replace(NEW); return; }
      cnt.innerHTML = '<b>' + left + '</b>초 후 이동합니다';
    }, 1000);
  } else {
    /* 8/23 이후 — 예전 주소는 더 이상 쓰지 않는다 */
    document.getElementById('ttl').textContent = '예전 주소는 사용이 끝났습니다';
    document.getElementById('msg').innerHTML =
      '2026년 8월 23일(주일)부터 앱 주소가 바뀌었습니다.<br>아래 새 주소를 눌러 주세요.';
    document.getElementById('cnt').textContent = '';
  }
})();
</script>
</body></html>
